<nav class="navbar">

  <a routerLink="/home" class="navbar-left">
    <div class="navbar-logo-icon">

        <path d="M2 10L11 3l9 7v9h-5v-5H7v5H2V10z" fill="white"/>

      <a routerLink="/login" class="btn-cerrar">Iniciar sesión</a>
