<h1>Consultar disponibilidad</h1>

<form [formGroup]="consultaForm" (ngSubmit)="consultarDisponibilidad()">
  <div>
    <label for="casaId">Casa ID</label>
    <input id="casaId" type="number" formControlName="casaId" />
  </div>

  <div>
    <label for="fechaEntrada">Fecha entrada</label>
    <input id="fechaEntrada" type="date" formControlName="fechaEntrada" />
  </div>

  <div>
    <label for="numeroNoches">Número de noches</label>
    <input id="numeroNoches" type="number" formControlName="numeroNoches" />
  </div>

  <button type="submit" [disabled]="loadingConsultar">
    {{ loadingConsultar ? 'Consultando...' : 'Consultar disponibilidad' }}
  </button>
</form>

<hr />

<div *ngIf="disponibilidadPorDia.length === 0">
  <p>No hay resultados para mostrar.</p>
</div>

<div *ngIf="disponibilidadPorDia.length > 0">
  <div *ngFor="let dia of disponibilidadPorDia">
    <h3>{{ dia.fecha }}</h3>
    <p><strong>Modalidad:</strong> {{ dia.modalidad }}</p>
    <p><strong>Estado casa:</strong> {{ dia.estadoCasa }}</p>

    <div>
      <strong>Habitaciones:</strong>
      <ul>
        <li *ngFor="let habitacion of dia.habitaciones">
          {{ habitacion.codigoHabitacion }} - {{ habitacion.estado }}
        </li>
      </ul>
    </div>

    <hr />
  </div>
</div>
